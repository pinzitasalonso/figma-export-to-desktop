<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #333;
      padding: 16px;
      background: #fff;
    }

    p {
      color: #666;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 10px 16px;
      background: #18a0fb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover:not(:disabled) { background: #0d8de0; }
    button:disabled { background: #bbb; cursor: not-allowed; }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #777;
      min-height: 16px;
    }

    #status.error   { color: #c0392b; }
    #status.success { color: #27ae60; }
  </style>
</head>
<body>
  <p>Exports selected frames (or all frames on the page) as PNG at 2× scale.</p>
  <button id="exportBtn">Export to Desktop</button>
  <div id="status"></div>

  <script>
    const btn    = document.getElementById('exportBtn');
    const status = document.getElementById('status');

    function setStatus(msg, cls) {
      status.textContent = msg;
      status.className = cls || '';
    }

    function downloadFile(bytes, filename) {
      const blob = new Blob([new Uint8Array(bytes)], { type: 'image/png' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    btn.addEventListener('click', () => {
      btn.disabled = true;
      setStatus('Exporting…');
      parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
    });

    window.addEventListener('message', async (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'empty') {
        setStatus('No frames found on this page.', 'error');
        btn.disabled = false;
        return;
      }

      if (msg.type === 'error') {
        setStatus('Error: ' + msg.message, 'error');
        btn.disabled = false;
        return;
      }

      if (msg.type === 'done') {
        let count = 0;

        for (let i = 0; i < msg.exports.length; i++) {
          const item     = msg.exports[i];
          const safeName = item.name
            .replace(/[\/\\?%*:|"<>]/g, '-')
            .replace(/\s+/g, ' ')
            .trim() || 'frame';

          downloadFile(item.bytes, safeName + '.png');
          count++;

          // Small stagger so the browser doesn't coalesce/drop concurrent downloads.
          if (i < msg.exports.length - 1) {
            await new Promise(r => setTimeout(r, 150));
          }
        }

        setStatus(
          'Done! ' + count + ' file' + (count !== 1 ? 's' : '') + ' saved to your Downloads folder.',
          'success'
        );
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
