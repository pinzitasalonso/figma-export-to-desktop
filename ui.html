<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #333;
      padding: 16px;
      background: #fff;
    }

    p { color: #666; margin-bottom: 12px; line-height: 1.5; }

    button {
      width: 100%;
      padding: 10px 16px;
      background: #18a0fb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: #0d8de0; }
    button:disabled { background: #bbb; cursor: not-allowed; }

    #counter {
      font-size: 11px;
      color: #999;
      margin-top: 6px;
      text-align: center;
      min-height: 15px;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #777;
      min-height: 16px;
    }
    #status.error   { color: #c0392b; }
    #status.success { color: #27ae60; }
  </style>
</head>
<body>
  <p id="desc">Exports selected frames (or all frames on the page) as PNG at 2× scale.</p>
  <button id="mainBtn">Export Frames</button>
  <div id="counter"></div>
  <div id="status"></div>

  <script>
    const mainBtn = document.getElementById('mainBtn');
    const counter = document.getElementById('counter');
    const status  = document.getElementById('status');
    const desc    = document.getElementById('desc');

    let queue = [];  // [{ name: string, bytes: number[] }]
    let idx   = 0;
    let phase = 'idle'; // 'idle' | 'saving'

    function setStatus(msg, cls) {
      status.textContent = msg;
      status.className = cls || '';
    }

    function setCounter(msg) { counter.textContent = msg; }

    function downloadCurrent() {
      const item  = queue[idx];
      const blob  = new Blob([new Uint8Array(item.bytes)], { type: 'image/png' });
      const url   = URL.createObjectURL(blob);
      const a     = document.createElement('a');
      a.href      = url;
      a.download  = item.name + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function advanceTo(i) {
      idx = i;
      if (idx < queue.length) {
        const item = queue[idx];
        mainBtn.textContent = '↓  Save  ' + item.name + '.png';
        setCounter((idx + 1) + ' of ' + queue.length);
        mainBtn.disabled = false;
      } else {
        // All done
        phase = 'idle';
        queue = [];
        idx   = 0;
        desc.textContent = 'Exports selected frames (or all frames on the page) as PNG at 2× scale.';
        mainBtn.textContent = 'Export Frames';
        setCounter('');
        setStatus('✓ All files saved!', 'success');
        mainBtn.disabled = false;
      }
    }

    mainBtn.addEventListener('click', () => {
      if (phase === 'idle') {
        mainBtn.disabled = true;
        setStatus('Exporting…');
        setCounter('');
        parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
        return;
      }

      if (phase === 'saving') {
        mainBtn.disabled = true;
        downloadCurrent();
        advanceTo(idx + 1);
      }
    });

    window.addEventListener('message', (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'empty') {
        setStatus('No frames found on this page.', 'error');
        mainBtn.disabled = false;
        return;
      }

      if (msg.type === 'error') {
        setStatus('Error: ' + msg.message, 'error');
        mainBtn.disabled = false;
        return;
      }

      if (msg.type === 'done') {
        queue = msg.exports.map(item => ({
          name:  (item.name.replace(/[\/\\?%*:|"<>]/g, '-').replace(/\s+/g, ' ').trim() || 'frame'),
          bytes: item.bytes,
        }));
        idx = 0;

        if (queue.length === 0) {
          setStatus('No frames exported.', 'error');
          mainBtn.disabled = false;
          return;
        }

        phase = 'saving';
        setStatus('');
        desc.textContent = 'Click the button once per file. First save will ask where — pick your Desktop; macOS remembers it for the rest.';
        advanceTo(0);
      }
    });
  </script>
</body>
</html>
