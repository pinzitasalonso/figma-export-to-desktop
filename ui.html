<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --accent-a: #18a0fb;
      --accent-b: #7c5cfc;
      --ink: #1c1c28;
      --muted: #6b6b76;
      --line: #ececf1;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: var(--ink);
      padding: 16px;
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ──────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .logo {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(124, 92, 252, 0.28);
    }
    .titles { display: flex; flex-direction: column; gap: 2px; }
    .title { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
    .subtitle { font-size: 11px; color: var(--muted); font-weight: 500; }

    /* ── Connection pill ─────────────────────────────────── */
    #bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f4f4f7;
      color: var(--muted);
    }
    #bar .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #b9b9c4;
      flex: 0 0 auto;
    }
    #bar.checking .dot { animation: pulse 1.1s ease-in-out infinite; }
    #bar.ok   { background: #e7f8ee; color: #157f47; }
    #bar.ok   .dot { background: #20b56b; box-shadow: 0 0 0 3px rgba(32,181,107,0.18); }
    #bar.warn { background: #fdf2e6; color: #b06a1d; }
    #bar.warn .dot { background: #e69327; box-shadow: 0 0 0 3px rgba(230,147,39,0.18); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    #desc { color: var(--muted); margin-bottom: 14px; line-height: 1.55; }

    /* ── Buttons ─────────────────────────────────────────── */
    button {
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.06s ease, box-shadow 0.15s ease, background 0.15s ease;
      margin-bottom: 8px;
    }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { background: #d6d6de !important; color: #fff !important; cursor: not-allowed; box-shadow: none !important; }
    button:focus-visible { outline: 2px solid rgba(24, 160, 251, 0.55); outline-offset: 2px; }

    .primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      box-shadow: 0 4px 12px rgba(24, 160, 251, 0.30);
    }
    .primary:hover:not(:disabled) { box-shadow: 0 6px 16px rgba(24, 160, 251, 0.42); }

    .secondary { background: #f1f1f4; color: var(--ink); }
    .secondary:hover:not(:disabled) { background: #e7e7ec; }

    #counter { font-size: 11px; color: var(--muted); text-align: center; min-height: 14px; margin-bottom: 6px; }

    #howto {
      display: none;
      background: #1f1f29;
      color: #e8e8ef;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      line-height: 1.55;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 8px;
    }

    #msg { font-size: 12px; color: var(--muted); min-height: 16px; line-height: 1.45; }
    #msg.error   { color: #d6402c; }
    #msg.success { color: #1aa05a; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="13" rx="2.5"/>
        <path d="M12 7.4v4.6"/>
        <path d="M9.4 9.8 12 12.4l2.6-2.6"/>
        <path d="M9 20h6"/>
        <path d="M12 17v3"/>
      </svg>
    </div>
    <div class="titles">
      <div class="title">Desktop Exporter</div>
      <div class="subtitle">PNG · 2× · flat to Desktop</div>
    </div>
  </header>

  <div id="bar" class="checking">
    <span class="dot"></span>
    <span id="barText">Checking for helper…</span>
  </div>

  <p id="desc">Exports selected layers (or all frames on the page) as PNG at 2× scale.</p>

  <button id="mainBtn" class="primary">Export to Desktop</button>
  <div id="counter"></div>

  <button id="startBtn" class="secondary" style="display:none">How to start the helper</button>
  <pre id="howto"></pre>
  <button id="retryBtn" class="secondary" style="display:none">Retry connection</button>

  <div id="msg"></div>

  <script>
    const PORT  = 31773;
    const BASE  = 'http://localhost:' + PORT; // must match manifest devAllowedDomains
    const TOKEN = 'figma-export-local-dev';   // must match the helper's FIGMA_EXPORT_TOKEN

    const bar      = document.getElementById('bar');
    const barText  = document.getElementById('barText');
    const desc     = document.getElementById('desc');
    const mainBtn  = document.getElementById('mainBtn');
    const counter  = document.getElementById('counter');
    const startBtn = document.getElementById('startBtn');
    const howto    = document.getElementById('howto');
    const retryBtn = document.getElementById('retryBtn');
    const msg      = document.getElementById('msg');

    const state = { connected: false, mode: 'idle', queue: [], idx: 0 };

    const HOWTO_TEXT =
      "The plugin can't launch the helper itself (Figma sandbox).\n" +
      "Open Terminal and run:\n\n" +
      "  cd <path-to>/figma-export-to-desktop/helper\n" +
      "  node server.js\n\n" +
      "Or auto-start it at login:\n\n" +
      "  cd <path-to>/figma-export-to-desktop/helper\n" +
      "  ./install.sh\n\n" +
      "Then click “Retry connection”.";

    function setMsg(t, cls) { msg.textContent = t || ''; msg.className = cls || ''; }
    function setCounter(t) { counter.textContent = t || ''; }
    function setBar(text, cls) { barText.textContent = text; bar.className = cls; }

    // Grow/shrink the plugin window to fit the content (incl. the "how to" block).
    function syncHeight() {
      const h = document.documentElement.scrollHeight;
      parent.postMessage({ pluginMessage: { type: 'resize', height: h } }, '*');
    }
    if (window.ResizeObserver) {
      new ResizeObserver(syncHeight).observe(document.body);
    } else {
      window.addEventListener('load', syncHeight);
    }

    // ── Connection detection ───────────────────────────────────────────────
    async function checkHealth() {
      setBar('Checking for helper…', 'checking');
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 1500);
        const r = await fetch(BASE + '/health', { signal: ctrl.signal });
        clearTimeout(timer);
        state.connected = r.ok;
      } catch (e) {
        state.connected = false;
      }
      render();
    }

    function render() {
      if (state.mode === 'stepping') return; // mid step-through, leave UI alone

      if (state.connected) {
        setBar('Helper connected — saving straight to Desktop', 'ok');
        desc.textContent = 'Exports selected layers (or all frames on the page) as PNG at 2× — written directly to your Desktop, no dialogs.';
        mainBtn.textContent = 'Export to Desktop';
        mainBtn.disabled = false;
        startBtn.style.display = 'none';
        retryBtn.style.display = 'none';
        howto.style.display = 'none';
      } else {
        setBar('Helper not running', 'warn');
        desc.textContent = 'Start the local helper for one-click, dialog-free export — or fall back to per-file downloads below.';
        mainBtn.textContent = 'Export via downloads';
        mainBtn.disabled = false;
        startBtn.style.display = 'block';
        retryBtn.style.display = 'block';
      }
      mainBtn.focus();
    }

    // ── Server export (zero dialogs) ───────────────────────────────────────
    async function serverSaveAll(queue) {
      for (let i = 0; i < queue.length; i++) {
        const f = queue[i];
        setMsg('Saving ' + (i + 1) + '/' + queue.length + ': ' + f.name + '.png …');
        try {
          const r = await fetch(BASE + '/save', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/octet-stream',
              'X-File-Name': f.name + '.png',
              'X-Auth-Token': TOKEN,
            },
            body: new Uint8Array(f.bytes),
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
        } catch (e) {
          setMsg('Failed on ' + f.name + '.png (' + e.message + '). Is the helper still running?', 'error');
          mainBtn.disabled = false;
          checkHealth();
          return;
        }
      }
      setMsg('✓ Saved ' + queue.length + ' file' + (queue.length !== 1 ? 's' : '') + ' to your Desktop.', 'success');
      mainBtn.disabled = false;
      mainBtn.focus();
    }

    // ── Download fallback (one click per file) ─────────────────────────────
    function downloadCurrent() {
      const f = state.queue[state.idx];
      const blob = new Blob([new Uint8Array(f.bytes)], { type: 'image/png' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = f.name + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function stepTo(i) {
      state.idx = i;
      if (state.idx < state.queue.length) {
        const f = state.queue[state.idx];
        mainBtn.textContent = '↓  Save  ' + f.name + '.png';
        setCounter((state.idx + 1) + ' of ' + state.queue.length);
        mainBtn.disabled = false;
        mainBtn.focus();
      } else {
        state.mode = 'idle';
        state.queue = [];
        state.idx = 0;
        setCounter('');
        setMsg('✓ All files saved.', 'success');
        render();
      }
    }

    // ── Buttons ────────────────────────────────────────────────────────────
    mainBtn.addEventListener('click', () => {
      if (state.mode === 'stepping') {
        mainBtn.disabled = true;
        downloadCurrent();
        stepTo(state.idx + 1);
        return;
      }
      mainBtn.disabled = true;
      setMsg('Exporting…');
      setCounter('');
      parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
    });

    startBtn.addEventListener('click', () => {
      if (howto.style.display === 'block') {
        howto.style.display = 'none';
      } else {
        howto.textContent = HOWTO_TEXT;
        howto.style.display = 'block';
      }
    });

    retryBtn.addEventListener('click', checkHealth);

    // Press Enter to fire the primary action (export, or save-next in download mode).
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !mainBtn.disabled) {
        e.preventDefault();
        mainBtn.click();
      }
    });

    // ── Messages from the plugin sandbox ───────────────────────────────────
    window.addEventListener('message', (event) => {
      const m = event.data.pluginMessage;
      if (!m) return;

      if (m.type === 'empty') {
        setMsg('Nothing to export. Select layers, or add frames to the page.', 'error');
        mainBtn.disabled = false;
        return;
      }
      if (m.type === 'error') {
        setMsg('Error: ' + m.message, 'error');
        mainBtn.disabled = false;
        return;
      }
      if (m.type === 'done') {
        const queue = m.exports.map((item) => ({
          name: (item.name.replace(/[\/\\?%*:|"<>]/g, '-').replace(/\s+/g, ' ').trim() || 'frame'),
          bytes: item.bytes,
        }));

        if (queue.length === 0) {
          setMsg('No frames exported.', 'error');
          mainBtn.disabled = false;
          return;
        }

        if (state.connected) {
          serverSaveAll(queue);
        } else {
          state.mode = 'stepping';
          state.queue = queue;
          setMsg('');
          desc.textContent = 'Click once per file. First save asks where — pick Desktop; macOS reuses it for the rest.';
          stepTo(0);
        }
      }
    });

    // Kick off detection on load.
    checkHealth();
  </script>
</body>
</html>
